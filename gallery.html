<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost Ink — Gallery</title>
  <link rel="stylesheet" href="css/style.css">
  
</head>
<body>

  <header id="site-header"></header>
  <script src="js/navbar.js"></script>
  <main class="gallery-page">
    <section class="gallery-intro" aria-labelledby="gallery-title">
      <span class="eyebrow">personal archive</span>
      <h1 class="page-title" id="gallery-title">your signatures</h1>
      <p class="page-subtitle">Every typing session leaves a unique mark.</p>
    </section>

    <section class="gallery-content" aria-label="Signature gallery">
      <div id="gallery-grid"></div>
      <button type="button" id="clear-all-btn" class="link-btn danger" hidden>clear all sessions</button>

      <div id="gallery-detail" hidden></div>
    </section>
  </main>

  <script src="js/db.js"></script>
  <script src="js/gallery.js"></script>

</body>
</html>
